server:
  port: ${SERVER_PORT:8080}

# # 生成自签名证书并保存到 resources 目录
#keytool -genkeypair -alias tomcat -keyalg RSA -keysize 2048 -keystore src\main\resources\keystore.p12 -validity 3650 -storetype PKCS12 -storepass changeit -dname "CN=localhost, OU=Development, O=Local, L=Local, ST=Local, C=CN"
spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
      file-size-threshold: 1MB # 超过该大小的文件会临时存到磁盘
  #=====================Mysql配置 =====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    #===================== 连接池配置 =====================
    hikari:
      # 最大连接数（默认 10，建议 20-50，根据服务器配置调整）
      maximum-pool-size: 30
      # 最小空闲连接
      minimum-idle: 10
      # 获取连接的最大等待时间（毫秒），默认 30 秒，建议 10 秒快速失败
      connection-timeout: 10000
      # 连接空闲超时时间（毫秒），默认 600000（10 分钟）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒），默认 1800000（30 分钟），建议小于 MySQL 的 wait_timeout（默认 8 小时）
      max-lifetime: 1800000
      # 连接测试 SQL（防止 MySQL 8 小时自动断开连接问题）
      connection-test-query: SELECT 1
      # 连接测试超时时间
      validation-timeout: 3000

