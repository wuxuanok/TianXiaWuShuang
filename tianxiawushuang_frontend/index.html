<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天下无双</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.staticfile.org/element-ui/2.15.13/theme-chalk/index.css">
    <script src="https://cdn.staticfile.org/vue/2.6.14/vue.min.js"></script>
    <script src="https://cdn.staticfile.org/element-ui/2.15.13/index.js"></script>
    <script src="https://cdn.staticfile.org/axios/1.3.4/axios.min.js"></script>

    <style>
        /* 核心修复：鼠标全局强制覆盖 */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            cursor: url("cursor/1.cur"), default !important; 
        }
        
        button, a, .el-button, .img-btn, .music-btn, .like-btn {
            cursor: url("cursor/1.cur"), pointer !important;
        }
        
        textarea, input {
            cursor: url("cursor/1.cur"), text !important;
        }

        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #000; font-family: "Microsoft YaHei", sans-serif; 
        }

        /* --- 欢迎大屏样式 --- */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c001e 0%, #000 100%);
            z-index: 10000; display: flex; justify-content: center; align-items: center;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #welcome-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .welcome-box {
            position: relative; z-index: 10001; text-align: center; pointer-events: none;
        }

        .welcome-title {
            display: flex; gap: 15px; justify-content: center;
        }

        .welcome-char {
            font-size: clamp(3.5rem, 15vw, 8rem);
            font-weight: 900; color: #fff;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 50px rgba(255, 105, 180, 0.4);
            opacity: 0; transform: translateY(30px);
            animation: charFadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes charFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-sub {
            color: rgba(255, 182, 193, 0.8); font-size: 1.5rem; margin-top: 20px;
            letter-spacing: 10px; opacity: 0; animation: fadeIn 1s 1.8s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        .welcome-fade-out { opacity: 0 !important; pointer-events: none !important; }

        /* --- 原有样式 --- */
        .background-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #danmaku-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: hidden; }

        .danmaku-item {
            position: absolute; white-space: nowrap; padding: 5px 14px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(1px);
            font-size: 17px; font-weight: bold; display: flex; align-items: center; gap: 4px;
            animation: move linear forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15); will-change: transform;
        }

        @keyframes move {
            0% { transform: translateX(100vw); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateX(-120%); opacity: 0; }
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 3; pointer-events: none !important; }
        .img-btn, .music-btn, .like-btn { z-index: 999 !important; position: fixed; pointer-events: auto !important; transition: all 0.3s ease; }
        .img-btn { top: 20px; right: 20px; padding: 12px 22px; background: rgba(38, 220, 211, 0.85); border-radius: 30px; color: white; border: none; font-weight: bold; font-size: 14px; }
        .music-btn { top: 20px; left: 20px; width: 44px; height: 44px; background: rgba(255,255,255,0.25); border-radius: 50%; color: #fff; border: 1px solid rgba(255,255,255,0.3); }
        .like-btn { bottom: 40px; left: 50%; transform: translateX(-50%); padding: 14px 30px; background: rgba(255, 80, 140, 0.9); border-radius: 40px; color: white; border: none; display: flex; align-items: center; gap: 10px; font-weight: bold; box-shadow: 0 4px 20px rgba(255, 80, 140, 0.4); }

        .text-container { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); z-index: 4; text-align: center; pointer-events: none; width: 100%; }
        .main-text { font-size: clamp(3.5rem, 15vw, 7rem); color: #fff; text-shadow: 0 5px 25px rgba(0,0,0,0.8); letter-spacing: 8px; font-weight: 900; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 30px; border-radius: 20px; width: 88%; max-width: 450px; }
        textarea { width: 100%; height: 150px; margin: 20px 0; padding: 15px; border-radius: 12px; border: 1px solid #eee; font-size: 16px; background: #f9f9f9; resize: none; outline: none; }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <canvas id="welcome-canvas"></canvas>
        <div class="welcome-box">
            <div class="welcome-title">
                <span class="welcome-char" style="animation-delay: 0.2s">欢</span>
                <span class="welcome-char" style="animation-delay: 0.5s">迎</span>
                <span class="welcome-char" style="animation-delay: 0.8s">回</span>
                <span class="welcome-char" style="animation-delay: 1.1s">家</span>
            </div>
            <div class="welcome-sub">天下无双</div>
        </div>
    </div>

    <div id="vue-app"></div>

    <img src="ground.gif" class="background-image">
    <div id="danmaku-container"></div>
    <div class="overlay"></div>
    
    <audio id="bgMusic" loop preload="auto"><source src="这世界那么多人.mp3" type="audio/mpeg"></audio>
    
    <button class="music-btn" id="musicBtn">🎵</button>
    <button class="img-btn" id="openModalBtn">💌 悄悄话留言板</button>
    
    <div class="text-container">
        <h1 class="main-text">天下无双</h1>
        <p style="color: rgba(255,255,255,0.9); font-size: 1.4rem; letter-spacing: 6px; margin-top: 10px;">相亲相爱一家人</p>
    </div>

    <button class="like-btn" id="likeBtn">
        <span style="font-size: 20px;">❤️</span>
        <span>为会长点亮爱心</span>
        <span id="likeCount">...</span>
    </button>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3 style="text-align: center; color: #ff508c;">💗 给会长的秘密告白 💗</h3>
            <textarea id="messageInput" placeholder="在这里写下你想对会长说的话吧..."></textarea>
            <div style="display: flex; gap: 12px;">
                <button id="cancelModalBtn" style="flex:1; padding:12px; border-radius:25px; border:none; background:#f5f5f5;">算啦</button>
                <button id="sendMsgBtn" style="flex:1; padding:12px; border-radius:25px; border:none; background: linear-gradient(to right, #ff80ab, #ff508c); color:white; font-weight:bold;">寄出信件 ✨</button>
            </div>
        </div>
    </div>

    <script>
        const app = new Vue({
            el: '#vue-app',
            methods: { showMsg(msg, type = 'success') { this.$message({ message: msg, type: type, center: true, offset: 70 }); } }
        });

        const API_BASE = "https://www.wushuang.asia";

        // --- 欢迎大屏逻辑：爱心环绕 ---
        function initWelcomeEffect() {
            const canvas = document.getElementById('welcome-canvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('welcome-overlay');
            
            let width, height, particles = [];
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Heart {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 100;
                    this.size = Math.random() * 15 + 5;
                    this.speed = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.3;
                    this.color = `hsla(${Math.random() * 30 + 330}, 80%, 70%, ${this.opacity})`;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    const topY = this.y - this.size;
                    ctx.moveTo(this.x, this.y);
                    ctx.bezierCurveTo(this.x - this.size, this.y - this.size, this.x - this.size, topY, this.x, topY);
                    ctx.bezierCurveTo(this.x + this.size, topY, this.x + this.size, this.y - this.size, this.x, this.y);
                    ctx.fill();
                }
                update() {
                    this.y -= this.speed;
                    if (this.y < -20) this.reset();
                }
            }

            for(let i=0; i<50; i++) particles.push(new Heart());

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            // 4秒后自动淡出并移除
            setTimeout(() => {
                overlay.classList.add('welcome-fade-out');
                setTimeout(() => { 
                    overlay.remove(); 
                    app.showMsg('欢迎回家~宝贝儿！！！ —— 来自会长的关怀', 'success');
                }, 1500);
            }, 4000);
        }
        initWelcomeEffect();

        // --- 弹幕逻辑 ---
        const teamMembers = ["无双", "猫猫", "酒叔", "阿真", "大蟑螂", "海盗猫", "不知鬼火", "神选", "Anoe", "积极向上哥", "iSaber", "北条时行", "易沽浊酒梦京华", "所求皆如愿", "🍉青山敬敬", "藟子", "Kay123", "天青色等暴风雨", "我tm肝爆", "此时此刻此人", "6785", "伤口撒盐同学", "叶月江海", "宵夜Ac", "离殇", "鸡蛋里没有放葱", "梦谷问道茶", "大a没跌啊", "贰之秋天", "Mis", "天星落", "祈罪", "天星落", "橘喵探月"];
        const colors = ['#FFB6C1','#87CEFA','#98FB98','#FFD700','#E6E6FA','#FFA07A','#00FFFF','#F0E68C'];

        function createDanmaku() {
            const container = document.getElementById('danmaku-container');
            if(!container) return;
            const name = teamMembers[Math.floor(Math.random() * teamMembers.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const div = document.createElement('div');
            div.className = 'danmaku-item';
            div.style.color = color;
            div.style.borderColor = color + '44';
            div.innerHTML = `<span>✨</span> ${name}`;
            div.style.top = (Math.random() * 90 + 2) + '%';
            const duration = Math.random() * 15 + 20;
            div.style.animationDuration = duration + 's';
            container.appendChild(div);
            setTimeout(() => { div.remove(); }, duration * 1000);
        }

        for(let i=0; i<30; i++) setTimeout(createDanmaku, Math.random() * 5000);
        setInterval(createDanmaku, 400);

        function getUserId() {
            try {
                let id = localStorage.getItem('wushuang_uid');
                if (!id) {
                    id = 'u_' + Math.random().toString(36).substring(2, 10);
                    localStorage.setItem('wushuang_uid', id);
                }
                return id;
            } catch (e) { return 'guest_' + Date.now(); }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const likeCountSpan = document.getElementById('likeCount');
            const messageInput = document.getElementById('messageInput');
            const modal = document.getElementById('modal');

            function refreshLikes() {
                axios.get(`${API_BASE}/like`).then(res => {
                    if(res.data && res.data.data) likeCountSpan.innerText = res.data.data.count;
                });
            }
            refreshLikes();

            document.getElementById('likeBtn').onclick = (e) => {
                e.preventDefault();
                axios.post(`${API_BASE}/like`, { userIdentifier: getUserId() }).then(res => {
                    if(res.data.code === 200) {
                        likeCountSpan.innerText = res.data.data.count;
                        app.showMsg('点亮成功！会长收到你的温暖啦 ❤️');
                    }
                });
            };

            document.getElementById('sendMsgBtn').onclick = () => {
                const content = messageInput.value.trim();
                if(!content) return app.showMsg('还没写内容呢 ~', 'warning');
                axios.post(`${API_BASE}/message`, { content: content, userIdentifier: getUserId() }).then(res => {
                    if(res.data.code === 200) {
                        app.showMsg('信件已投递！会长一定会很开心的 ✨');
                        messageInput.value = '';
                        modal.classList.remove('active');
                    }
                });
            };

            document.getElementById('openModalBtn').onclick = () => modal.classList.add('active');
            document.getElementById('cancelModalBtn').onclick = () => modal.classList.remove('active');
            
            const musicBtn = document.getElementById('musicBtn');
            const bgMusic = document.getElementById('bgMusic');
            let isPlaying = false;
            musicBtn.onclick = () => {
                isPlaying ? bgMusic.pause() : bgMusic.play();
                musicBtn.textContent = isPlaying ? '🔇' : '🎵';
                isPlaying = !isPlaying;
            };

            document.body.addEventListener('touchstart', () => {
                if(!isPlaying) { bgMusic.play().then(() => { isPlaying = true; musicBtn.textContent = '🎵'; }); }
            }, { once: true });
        });
    </script>
</body>
</html>
